<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Kirish - EcoCharge Uz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                'eco-teal': '#14b8a6',
                'eco-dark': '#1e293b',
                'eco-bg': '#f1f5f9'
              }
            }
          }
        }
    </script>
</head>
<body class="bg-eco-bg text-eco-dark font-sans flex items-center justify-center min-h-screen">

    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-eco-teal rounded-full flex items-center justify-center text-white font-bold text-xl mx-auto mb-4">E</div>
            <h2 class="text-2xl font-bold text-eco-dark">Admin Panelga Kirish</h2>
            <p class="text-gray-500 text-sm mt-1">Davom etish uchun ma'lumotlarni kiriting</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Login</label>
                <input type="text" id="username" required placeholder="admin" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-eco-teal">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Parol</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-eco-teal">
            </div>
            <div id="error-msg" class="text-red-500 text-sm hidden text-center">Login yoki parol noto'g'ri!</div>
            
            <button type="submit" class="w-full bg-eco-teal text-white py-3 rounded-xl font-semibold shadow-lg shadow-teal-200 hover:bg-teal-600 transition">
                Kirish
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="../client/index.html" class="text-sm text-gray-500 hover:text-eco-teal transition">← Saytga qaytish</a>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Oddiy tekshiruv (real loyihada serverda tekshiriladi)
            if (user === 'admin' && pass === '1234') {
                window.location.href = 'dashboard.html';
            } else {
                const err = document.getElementById('error-msg');
                err.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
